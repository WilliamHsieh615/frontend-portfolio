<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CDN Swiper + Lightbox</title>

    <!-- Swiper CDN -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Vue Easy Lightbox -->
    <script src="https://unpkg.com/vue-easy-lightbox@next/dist/vue-easy-lightbox.umd.min.js"></script>

    <style>
        .wrap{
            max-width: 800px;
            height: 100vh;
            margin: 0 auto;
        }
        .main-swiper img {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            cursor: pointer;
            border-radius: 10px;
        }

        .thumbs-swiper img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .thumbs-swiper img:hover {
            border-color: #007bff;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="wrap">
            <div class="product-gallery">
                <!-- 主輪播 -->
                <div class="swiper main-swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide" v-for="(img, index) in images" :key="index">
                            <img :src="img" alt="Product Image" @click="openLightbox(index)" />
                        </div>
                    </div>
                    <!-- 箭頭 -->
                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev"></div>
                </div>

                <!-- 縮圖輪播 -->
                <div class="swiper thumbs-swiper mt-4">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide" v-for="(img, index) in images" :key="index">
                            <img :src="img" alt="Thumbnail" @click="openLightbox(index)" />
                        </div>
                    </div>
                </div>

                <!-- Lightbox -->
                <vue-easy-lightbox :visible="visible" :imgs="images" :index="currentIndex" @hide="visible = false" />
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue

        createApp({
            components: {
                VueEasyLightbox: window.VueEasyLightbox
            },
            setup() {
                const images = [
                    "https://picsum.photos/800/600?random=1",
                    "https://picsum.photos/800/600?random=2",
                    "https://picsum.photos/800/600?random=3",
                    "https://picsum.photos/800/600?random=4",
                    "https://picsum.photos/800/600?random=5",
                    "https://picsum.photos/800/600?random=6",
                    "https://picsum.photos/800/600?random=7",
                    "https://picsum.photos/800/600?random=8",
                    "https://picsum.photos/800/600?random=9",
                    "https://picsum.photos/800/600?random=10"
                ]
                const visible = ref(false)
                const currentIndex = ref(0)

                const openLightbox = (index) => {
                    currentIndex.value = index
                    visible.value = true
                }

                onMounted(() => {
                    const thumbs = new Swiper('.thumbs-swiper', {
                        slidesPerView: 4,
                        spaceBetween: 10,
                    })
                    new Swiper('.main-swiper', {
                        loop: true,
                        navigation: {
                            nextEl: '.swiper-button-next',
                            prevEl: '.swiper-button-prev',
                        },
                        autoplay: { delay: 3000 },
                        thumbs: { swiper: thumbs }
                    })
                })

                return { images, visible, currentIndex, openLightbox }
            }
        }).mount('#app')
    </script>
</body>

</html>
